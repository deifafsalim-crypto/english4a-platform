<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مغامرة الإنجليزي – الصف الرابع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF5F9; --bg2:#E3F0EC; --card:#FFFFFF; --ink:#26405A; --ink2:#5E7489; --line:rgba(38,64,90,.09);
  --teal:#2E9C8E; --tealSoft:#D6F1EB; --sun:#FFD36B; --sunSoft:#FFF4CF; --coral:#F79A86; --ok:#39B786; --okSoft:#DDF5EA;
  --bad:#EE7280; --badSoft:#FCE3E6; --shadow:0 22px 44px -24px rgba(38,64,90,.35), 0 2px 6px -2px rgba(38,64,90,.08);
  --ease:cubic-bezier(.32,.72,0,1); --spring:cubic-bezier(.34,1.56,.64,1);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15212C; --bg2:#172A2A; --card:#1E2E3C; --ink:#EAF2F8; --ink2:#A9BBCB; --line:rgba(234,242,248,.1);
    --tealSoft:#1F4540; --sunSoft:#4A3F1C; --okSoft:#1C4234; --badSoft:#4B2229; --shadow:0 22px 44px -24px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15212C; --bg2:#172A2A; --card:#1E2E3C; --ink:#EAF2F8; --ink2:#A9BBCB; --line:rgba(234,242,248,.1);
  --tealSoft:#1F4540; --sunSoft:#4A3F1C; --okSoft:#1C4234; --badSoft:#4B2229; --shadow:0 22px 44px -24px rgba(0,0,0,.6);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100dvh;font-family:'Baloo Bhaijaan 2',Tahoma,'Segoe UI',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 110% -10%, var(--bg2), transparent 60%),radial-gradient(900px 500px at -10% 20%, color-mix(in srgb,var(--sun) 18%,transparent), transparent 60%),var(--bg);
  font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.en{direction:ltr;unicode-bidi:isolate;font-family:'Baloo Bhaijaan 2','Trebuchet MS',system-ui,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 80px}
img,svg{max-width:100%}

/* top island nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;justify-content:center;padding:14px 12px 0}
.nav-in{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:999px;background:color-mix(in srgb,var(--card) 82%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow);border:1px solid var(--line)}
.nav .logo{display:flex;align-items:center;gap:8px;padding:2px 10px 2px 6px;font-weight:800;font-size:17px}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--sunSoft);font-weight:700;font-size:15px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg);font-size:19px;transition:transform .5s var(--spring)}
.iconbtn:active{transform:scale(.9)}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center;padding:44px 0 28px}
.hero h1{font-size:clamp(34px,5.4vw,58px);line-height:1.08;margin:0 0 10px;font-weight:800;letter-spacing:-.5px}
.hero h1 .en{display:block;font-size:.5em;color:var(--teal);font-weight:700;margin-top:8px}
.hero p{color:var(--ink2);margin:0 0 18px;max-width:46ch}
.namebox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.namebox input{font:inherit;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0;width:200px}
.namebox input:focus{outline:none;border-color:var(--teal)}
.mascot-wrap{position:relative;display:grid;place-items:center}
.mascot{width:min(300px,80%);animation:bob 4s var(--ease) infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-10px) rotate(2deg)}}
.bubble{position:absolute;top:4%;inset-inline-start:0;background:var(--card);padding:10px 16px;border-radius:22px 22px 22px 6px;box-shadow:var(--shadow);font-weight:700;font-size:16px;max-width:210px}
.progress-card{margin-top:18px;background:var(--card);border-radius:24px;padding:14px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:14px;max-width:460px}
.bar{flex:1;height:14px;border-radius:99px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#6FD1BF);transform-origin:right;transition:transform 1s var(--ease)}

/* section titles */
.sec-title{display:flex;align-items:baseline;gap:12px;margin:34px 0 16px;flex-wrap:wrap}
.sec-title h2{margin:0;font-size:28px;font-weight:800}
.sec-title span{color:var(--ink2);font-size:16px}

/* unit path */
.path{display:grid;grid-template-columns:repeat(12,1fr);gap:18px}
.ucard{grid-column:span 4;position:relative;text-align:start;border-radius:30px;padding:6px;background:color-mix(in srgb,var(--u) 45%,transparent);
  transition:transform .6s var(--spring)}
.ucard:hover{transform:translateY(-4px) rotate(-.6deg)}
.ucard:active{transform:scale(.97)}
.ucard .core{border-radius:24px;background:var(--card);padding:18px 18px 16px;height:100%;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.ucard .top{display:flex;justify-content:space-between;align-items:center}
.ucard .emo{font-size:44px;line-height:1;width:72px;height:72px;border-radius:22px;display:grid;place-items:center;background:color-mix(in srgb,var(--u) 55%,var(--card))}
.ucard .num{font-weight:800;font-size:14px;color:var(--ink2);background:var(--bg);padding:3px 12px;border-radius:99px}
.ucard h3{margin:6px 0 0;font-size:22px;line-height:1.2}
.ucard .sub{color:var(--ink2);font-size:15px}
.stars{display:flex;gap:2px;font-size:20px;letter-spacing:1px}
.stars .off{filter:grayscale(1);opacity:.3}
.ucard.wide{grid-column:span 6}
.ucard.final{grid-column:span 12;background:linear-gradient(120deg,#FFE08A,#FFC6B5,#C9E8FF)}
.ucard.final .core{flex-direction:row;align-items:center;gap:18px}
.ucard.final .emo{background:var(--sunSoft);font-size:52px;width:90px;height:90px}

/* unit page */
.uhead{margin:26px 0 8px;border-radius:34px;padding:6px;background:color-mix(in srgb,var(--u) 50%,transparent)}
.uhead .core{border-radius:28px;background:linear-gradient(135deg,color-mix(in srgb,var(--u) 45%,var(--card)),var(--card));padding:24px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.uhead .emo{font-size:60px;line-height:1}
.uhead h1{margin:0;font-size:clamp(26px,4vw,40px);line-height:1.15}
.uhead p{margin:4px 0 0;color:var(--ink2)}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;margin-top:22px}
.tabs{display:flex;gap:8px;margin:20px 0 6px;background:var(--card);padding:6px;border-radius:999px;box-shadow:var(--shadow);width:max-content;max-width:100%;overflow-x:auto}
.tab{padding:10px 20px;border-radius:999px;font-weight:700;white-space:nowrap;transition:background .5s var(--ease),transform .5s var(--spring)}
.tab.on{background:var(--u);color:#1f3346}
.tab:active{transform:scale(.95)}

.block{background:var(--card);border-radius:28px;padding:22px;box-shadow:var(--shadow);margin:18px 0}
.block h3{margin:0 0 4px;font-size:23px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--bg);color:var(--ink2)}
.tag.book{background:var(--tealSoft);color:var(--teal)}

/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.vcard{perspective:800px;height:150px}
.vcard .in{position:relative;width:100%;height:100%;transition:transform .7s var(--spring);transform-style:preserve-3d}
.vcard.flip .in{transform:rotateY(180deg)}
.vface{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:10px;text-align:center}
.vface.f{background:color-mix(in srgb,var(--u) 38%,var(--card))}
.vface.b{background:var(--sunSoft);transform:rotateY(180deg)}
.vface .e{font-size:42px;line-height:1.1}
.vface .w{font-weight:800;font-size:18px;line-height:1.2}
.vface .ar{font-size:19px;font-weight:700}
.vhint{font-size:14px;color:var(--ink2);margin-top:4px}

/* grammar */
.bi{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.bi > div{border-radius:20px;padding:14px 16px}
.bi .arx{background:var(--tealSoft)}
.bi .enx{background:var(--sunSoft);text-align:left}
.bi h4{margin:0 0 4px;font-size:15px;color:var(--ink2);font-weight:700}
.ex-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.ex{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:16px;padding:8px 12px}
.ex .en{flex:1;font-weight:600;text-align:left}
.ex .ar2{color:var(--ink2);font-size:15px}
.say{width:38px;height:38px;flex:none;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:17px;box-shadow:0 4px 10px -6px rgba(0,0,0,.3);transition:transform .4s var(--spring)}
.say:active{transform:scale(.85)}
table.tt{border-collapse:collapse;width:100%;min-width:360px;font-size:16px;direction:ltr}
.tt td,.tt th{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line)}
.tt th{color:var(--ink2);font-weight:700}
.scroll{overflow-x:auto}
.mini{margin-top:14px;border:2px dashed var(--line);border-radius:20px;padding:14px}
.mini .q{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{padding:10px 18px;border-radius:999px;background:var(--bg);font-weight:700;transition:transform .45s var(--spring),background .3s var(--ease)}
.opt:hover{transform:translateY(-2px)}
.opt.ok{background:var(--ok);color:#fff}
.opt.no{background:var(--bad);color:#fff;animation:shake .45s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.fb{margin-top:8px;font-weight:600;font-size:16px}

/* games grid */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-top:18px}
.gcard{border-radius:28px;padding:6px;background:color-mix(in srgb,var(--u) 40%,transparent);text-align:start;transition:transform .55s var(--spring)}
.gcard:hover{transform:translateY(-4px) rotate(.8deg)}
.gcard .core{background:var(--card);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:4px;height:100%;box-shadow:var(--shadow)}
.gcard .e{font-size:40px}
.gcard b{font-size:20px}
.gcard small{color:var(--ink2);font-size:15px}
.done{align-self:flex-start;font-size:13px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--okSoft);color:var(--ok)}

/* overlay */
.ov{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 16px);opacity:0;transition:opacity .5s var(--ease)}
.ov.show{opacity:1}
.panel{width:min(760px,100%);background:var(--card);border-radius:32px;box-shadow:var(--shadow);padding:20px;transform:translateY(30px) scale(.97);transition:transform .7s var(--spring);margin:auto 0}
.ov.show .panel{transform:none}
.phead{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:10px}
.phead h2{margin:0;font-size:22px}
.hearts{font-size:20px;letter-spacing:2px}
.gbar{height:10px;border-radius:99px;background:var(--bg);overflow:hidden;margin:6px 0 16px}
.gbar i{display:block;height:100%;background:var(--u,var(--teal));transition:transform .6s var(--ease);transform-origin:right}
.prompt{min-height:120px;border-radius:24px;background:color-mix(in srgb,var(--u,var(--tealSoft)) 30%,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center;font-size:22px;font-weight:700}
.prompt .big{font-size:64px;line-height:1}
.prompt .en{font-size:24px}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}
.choice{padding:16px 12px;border-radius:22px;background:var(--bg);font-weight:800;font-size:20px;min-height:66px;transition:transform .45s var(--spring),background .3s var(--ease);box-shadow:inset 0 -4px 0 rgba(38,64,90,.08)}
.choice:hover{transform:translateY(-3px)}
.choice:active{transform:scale(.96)}
.choice.ok{background:var(--ok);color:#fff}
.choice.no{background:var(--bad);color:#fff;animation:shake .45s}
.choice[disabled]{cursor:default}
.explain{margin-top:14px;border-radius:18px;padding:12px 16px;font-weight:600;font-size:17px}
.explain.good{background:var(--okSoft)}
.explain.oops{background:var(--badSoft)}
.pfoot{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:16px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:10px;padding:8px 8px 8px 20px;border-radius:999px;background:var(--teal);color:#fff;font-weight:800;font-size:18px;transition:transform .5s var(--spring)}
[dir="rtl"] .cta{padding:8px 20px 8px 8px}
.cta .ic{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;transition:transform .5s var(--spring)}
.cta:hover .ic{transform:translateX(-3px) scale(1.06)}
.cta:active{transform:scale(.97)}
.cta.soft{background:var(--bg);color:var(--ink)}
.cta.soft .ic{background:var(--card)}
.cta.sun{background:var(--sun);color:#3a2d00}

/* memory */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1/1;perspective:600px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .6s var(--spring);transform-style:preserve-3d}
.mc.open .in,.mc.got .in{transform:rotateY(180deg)}
.mc .fa{position:absolute;inset:0;border-radius:18px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;padding:6px;font-weight:800;font-size:clamp(13px,2.6vw,18px);line-height:1.15}
.mc .fr{background:color-mix(in srgb,var(--u) 60%,var(--card));font-size:30px}
.mc .bk{background:var(--sunSoft);transform:rotateY(180deg)}
.mc .bk .emo2{font-size:clamp(28px,6vw,44px)}
.mc.got .bk{background:var(--okSoft)}

/* sort */
.sitem{display:inline-block;padding:14px 26px;border-radius:22px;background:var(--card);font-size:24px;font-weight:800;box-shadow:var(--shadow);animation:pop .55s var(--spring)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.buckets{display:grid;gap:12px;margin-top:16px}
.bucket{border-radius:24px;padding:14px;background:var(--bg);font-weight:800;font-size:19px;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:110px;transition:transform .45s var(--spring),background .3s var(--ease)}
.bucket .be{font-size:34px}
.bucket .cnt{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:13px;font-weight:600}
.bucket .cnt span{background:var(--card);padding:0 8px;border-radius:99px}
.bucket.flash{background:var(--okSoft);transform:scale(1.04)}
.bucket.wrong{background:var(--badSoft);animation:shake .45s}

/* build */
.slot{min-height:70px;border-radius:22px;border:2px dashed var(--line);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;direction:ltr;margin-top:14px}
.slot.ok{border-color:var(--ok);background:var(--okSoft)}
.slot.no{border-color:var(--bad);animation:shake .45s}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;direction:ltr;justify-content:center}
.chip{padding:10px 16px;border-radius:16px;background:color-mix(in srgb,var(--u) 45%,var(--card));font-weight:800;font-size:20px;animation:pop .45s var(--spring);box-shadow:inset 0 -3px 0 rgba(38,64,90,.1)}
.chip.used{visibility:hidden}

/* results */
.result{text-align:center;padding:10px 0}
.result .big{font-size:80px;line-height:1;animation:pop .8s var(--spring)}
.result h2{margin:8px 0 2px;font-size:30px}
.result .stars{justify-content:center;font-size:40px;margin:8px 0}
.review{text-align:start;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.review div{background:var(--badSoft);border-radius:14px;padding:8px 12px;font-size:16px}

/* confetti */
.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf i{position:absolute;top:-20px;width:12px;height:16px;border-radius:3px;animation:fall 2.4s var(--ease) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.7}}

.cert{border-radius:28px;padding:6px;background:linear-gradient(120deg,#FFE08A,#FFC6B5,#C9E8FF);margin-top:14px}
.cert .core{background:var(--card);border-radius:22px;padding:22px;text-align:center}
.cert h3{margin:0;font-size:26px}
.cert .nm{font-size:34px;font-weight:800;color:var(--teal)}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.reveal.in{opacity:1;transform:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.foot{text-align:center;color:var(--ink2);font-size:14px;margin-top:40px}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:24px}
  .mascot-wrap{order:-1}.mascot{width:190px}
  .bubble{position:static;margin-bottom:8px}
  .ucard,.ucard.wide{grid-column:span 12!important}
  .ucard:hover{transform:none}
  .bi{grid-template-columns:1fr}
  .mgrid{grid-template-columns:repeat(3,1fr)}
  .nav .logo span.t{display:none}
}
@media (max-width:480px){ .choices{grid-template-columns:1fr} .choice{font-size:18px} body{font-size:17px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <button class="logo" onclick="location.hash='#/'" aria-label="الرئيسية"><span style="font-size:26px">🐢</span><span class="t">مغامرة الإنجليزي</span></button>
  <span class="pill" title="نجومك">⭐ <b id="starCount">0</b></span>
  <button class="iconbtn" id="sndBtn" onclick="toggleSound()" aria-label="الصوت">🔊</button>
  <button class="iconbtn" id="themeBtn" onclick="toggleTheme()" aria-label="الوضع الليلي">🌙</button>
</div></nav>
<main class="wrap" id="app"></main>
<div id="ovRoot"></div>

<script>
/* ============ DATA ============ */
const UNITS = [
{
 id:"welcome", num:"W", color:"#BFE3F7", emoji:"👋", title:"New neighbours", ar:"جيران جدد", pages:"ص 10–13",
 intro:"نتعرّف على الدول والجنسيات والهوايات والأرقام من 50 إلى 100.",
 vocab:[
  {g:"Countries & nationalities – الدول والجنسيات", items:[
   ["🇴🇲","Oman – Omani","عُمان – عُماني"],["🇦🇺","Australia – Australian","أستراليا – أسترالي"],["🇨🇳","China – Chinese","الصين – صيني"],
   ["🇬🇧","Britain – British","بريطانيا – بريطاني"],["🇧🇷","Brazil – Brazilian","البرازيل – برازيلي"],["🇪🇬","Egypt – Egyptian","مصر – مصري"],["🇺🇸","the USA – American","أمريكا – أمريكي"]]},
  {g:"Hobbies – الهوايات", items:[
   ["🛶","canoeing","التجديف بالقارب"],["📖","reading","القراءة"],["🏓","playing table tennis","تنس الطاولة"],["⚽","playing football","كرة القدم"],
   ["🛍️","going shopping","التسوّق"],["🎾","playing tennis","التنس"],["🏀","playing basketball","كرة السلة"],["🏊","swimming","السباحة"]]},
  {g:"Numbers – الأرقام", items:[

   en:"After <b>like</b> use verb + <b>-ing</b>. With <b>he/she</b> add <b>s</b>: She <b>likes</b> swimming. Negative: I <b>don't</b> like / He <b>doesn't</b> like.",

  {t:"Numbers 50–100", tar:"الأرقام من 50 إلى 100", page:"ص 13",
   ar:"نعدّ بالعشرات: <span class='en'>fifty, sixty, seventy, eighty, ninety, one hundred</span>. وبين العشرات نضع شَرطة: <span class='en'>fifty-one, fifty-two …</span>. وفي الحساب: <span class='en'>plus</span> = زائد، <span class='en'>minus</span> = ناقص، <span class='en'>equals</span> = يساوي.",

 grammar:[
  {t:"Telling the time", tar:"كيف نقول الوقت", page:"ص 18",
   ar:"<span class='en'>o'clock</span> = الساعة تماماً • <span class='en'>quarter past</span> = وربع • <span class='en'>half past</span> = ونص • <span class='en'>quarter to</span> = إلا ربع.<br>مثال: 7:30 = <b class='en'>half past seven</b> و 9:45 = <b class='en'>quarter to ten</b> (لأنها قبل العاشرة بربع ساعة).",
   en:"8:00 = eight o'clock • 11:15 = quarter past eleven • 10:30 = half past ten • 9:45 = quarter to ten.",
   clocks:[[8,0,"eight o'clock"],[11,15,"quarter past eleven"],[10,30,"half past ten"],[9,45,"quarter to ten"]],
   mini:{q:"🕡 6:30 = ?", o:["half past six","half past seven","quarter past six"], a:"half past six", ex:"الدقيقة 30 = half past، والساعة 6."}},
  {t:"Present simple + days and times", tar:"المضارع البسيط مع الأيام والأوقات", page:"ص 18",
   ar:"نستخدم المضارع البسيط للأشياء التي تتكرر (الجدول المدرسي). مع <b class='en'>I / you / we / they</b> نقول <b class='en'>have</b>، ومع <b class='en'>he / she</b> نقول <b class='en'>has</b> ونضيف <b class='en'>s</b> للفعل: <span class='en'>play → plays</span>.<br>النفي: <b class='en'>doesn't have</b> • السؤال: <b class='en'>When do we have Maths?</b><br>مع الأيام نستخدم <b class='en'>on</b> ومع الساعة نستخدم <b class='en'>at</b>.",
   en:"Use the present simple for routines. I/we <b>have</b>, he/she <b>has</b>. Negative: <b>doesn't have</b>. Use <b>on</b> + day, <b>at</b> + time.",
   ex:[["We have Maths on Tuesdays at half past ten.","عندنا رياضيات أيام الثلاثاء الساعة العاشرة والنصف."],["I have Science at quarter past eleven.","عندي علوم الساعة الحادية عشرة والربع."],["Azza doesn't have P.E. at quarter to ten on Wednesdays.","عزة ليس عندها رياضة الساعة العاشرة إلا ربع أيام الأربعاء."],["When do we have Maths?","متى عندنا رياضيات؟"]],
   table:true,
   mini:{q:"📗 Lottie's timetable: What does she do at quarter past eight on Sundays?", o:["She has Science.","She goes home.","She has Maths."], a:"She has Science.", ex:"في الجدول: 8:15 Science."}},
  {t:"Adverbs of frequency", tar:"كلمات التكرار (كم مرة؟)", page:"ص 19",
   ar:"كلمات <span class='en'>always, often, sometimes, never</span> تأتي <b>قبل الفعل</b>: <span class='en'>He always eats fish.</span> لكن تأتي <b>بعد</b> <span class='en'>is / am / are</span>: <span class='en'>She is always busy.</span><br>أما عبارات <span class='en'>every day, twice a week, once a week, at the weekend</span> فتأتي في <b>آخر الجملة</b>.",
   en:"<b>always / often / sometimes / never</b> go <b>before</b> the main verb but <b>after</b> be. Phrases like <b>twice a week</b> go at the end.",
   ex:[["She plays tennis twice a week.","هي تلعب التنس مرتين في الأسبوع."],["I do my homework every day.","أحل واجبي كل يوم."],["She is always busy.","هي دائماً مشغولة."],["He always eats fish for lunch.","هو دائماً يأكل السمك على الغداء."]],
   mini:{q:"Choose the correct sentence:", o:["He is always busy.","He always is busy.","Always he is busy."], a:"He is always busy.", ex:"always تأتي بعد is."}},
  {t:"Making arrangements", tar:"الاتفاق على موعد", page:"ص 21",
   ar:"لندعو صديقاً نقول <b class='en'>Do you want to …?</b> وللرفض بلطف: <b class='en'>Sorry, I can't.</b> أو <b class='en'>I'm not free.</b> ونقترح موعداً آخر: <b class='en'>What about Saturday?</b> ثم نتفق: <b class='en'>Let's meet at …</b>",
   en:"Invite: <b>Do you want to play football tomorrow?</b> Say no politely: <b>Sorry, I can't.</b> Suggest: <b>What about Saturday?</b> Agree: <b>Let's meet at quarter to five in the park.</b>",
   ex:[["Do you want to play football tomorrow morning?","هل تريد أن نلعب كرة قدم صباح الغد؟"],["Sorry, I can't. I go swimming on Friday mornings.","آسف، لا أستطيع. أذهب للسباحة صباح الجمعة."],["Let's meet at quarter to five in the park.","لنلتقِ الساعة الخامسة إلا ربع في الحديقة."]]},
  {t:"Phonics: long i", tar:"صوت الـ i الطويل", page:"ص 24",
   ar:"هذه الحروف كلها تُنطق مثل <b class='en'>ai</b> في كلمة <span class='en'>my</span>: <b class='en'>y</b> (fly, my, shy) • <b class='en'>ie</b> (pie) • <b class='en'>igh</b> (night) • <b class='en'>i-e</b> (kite). في i-e حرف e في الآخر لا يُنطق لكنه يجعل i طويلة!",
   en:"y, ie, igh and i-e all make the long /aɪ/ sound: fly, pie, night, kite.",
   ex:[["Every night, I eat a pie and fly a kite.","كل ليلة آكل فطيرة وأطيّر طائرة ورقية."],["my, fly, shy","ي في الآخر"],["light, right, night","igh"]],
   mini:{q:"Which word has the same sound as <span class='en'>night</span>?", o:["fly","fish","sit"], a:"fly", ex:"fly و night فيهما صوت i الطويل."}},
  {t:"Writing tip", tar:"نصيحة الكتابة", page:"ص 23",
   ar:"ابدأ كل جملة بـ <b>حرف كبير</b> واكتب أسماء المواد بحرف كبير (<span class='en'>Maths, Science</span>) وضع <b>نقطة</b> في آخر الجملة.",

 grammar:[
  {t:"There is / There are", tar:"يوجد", page:"ص 40",
   ar:"<b class='en'>There is (There's)</b> مع الشيء المفرد أو الذي لا يُعدّ (مثل bread, salad, tea).<br><b class='en'>There are</b> مع الجمع (مثل noodles, cupcakes, apples).",
   en:"<b>There's</b> + singular / uncountable. <b>There are</b> + plural.",
   ex:[["There's some cheese.","يوجد بعض الجبن."],["There are a lot of noodles.","يوجد الكثير من النودلز."],["There's a bag of apples.","يوجد كيس تفاح."]],
   mini:{q:"There ____ some cupcakes.", o:["are","is","be"], a:"are", ex:"cupcakes جمع ← are."}},
  {t:"a few / a little / a lot of / some", tar:"قليل وكثير", page:"ص 40",
   ar:"الأشياء التي <b>نعدّها</b> (sandwiches, apples) نقول معها <b class='en'>a few</b> = قليل.<br>الأشياء التي <b>لا نعدّها</b> (lemonade, salad, bread) نقول معها <b class='en'>a little</b> = قليل.<br><b class='en'>a lot of</b> = كثير و <b class='en'>some</b> = بعض، مع النوعين.",
   en:"<b>a few</b> + countable (a few sandwiches). <b>a little</b> + uncountable (a little lemonade). <b>a lot of</b> and <b>some</b> go with both.",
   ex:[["There are a lot of noodles, some crisps and a few sandwiches.","كثير من النودلز وبعض الشيبس وقليل من السندويشات."],["There is a lot of salad, some coffee and a little lemonade.","كثير من السلطة وبعض القهوة وقليل من الليمون."]],

function gPick(u,g,gi){let items=shuffle(g.items),k=0,hearts=3,score=0;
 openOv("",u.color);
 function draw(){if(k>=items.length){winScreen(u,gi,`جاوبت ${score} من ${items.length} صح!`);return}
  const it=items[k];let prompt="";
  if(it.clock) prompt=clockSVG(it.clock[0],it.clock[1])+`<div style="font-size:18px"><span class="en">What time is it?</span> — كم الساعة؟</div>`;
  else if(it.shape) prompt=shapeSVG(it.shape)+`<div style="font-size:18px"><span class="en">What shape is it?</span> — ما الشكل؟</div>`;
  else if(it.say&&!it.p) prompt=`<button class="say" style="width:96px;height:96px;font-size:44px" onclick="say('${esc(it.say)}')">🔊</button><div style="font-size:17px">اضغط واسمع ثم اختر</div>`;
  else prompt=`<div class="big" style="font-size:40px;line-height:1.4">${it.p}</div>`;
  $(".panel").innerHTML=head(`${g.e} ${g.tar}`,`<span class="hearts">${"❤️".repeat(hearts)}${"🤍".repeat(3-hearts)}</span>`)+
   `<div class="gbar"><i style="transform:scaleX(${k/items.length})"></i></div><div class="prompt">${prompt}</div>
   <div class="choices">${shuffle(it.o).map(o=>`<button class="choice en" data-o="${esc(o)}">${o}</button>`).join("")}</div><div id="gfb"></div>`;
  if(it.say&&!it.p) setTimeout(()=>say(it.say),350);
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
   const ok=b.dataset.o===it.a;document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
   if(ok){b.classList.add("ok");score++;beep(true);say(it.a);$("#gfb").innerHTML=`<div class="explain good">✅ ${["رائع!","ممتاز!","أحسنت!","برافو!"][k%4]}</div>`;k++;setTimeout(draw,900)}
   else{b.classList.add("no");hearts--;beep(false);document.querySelectorAll(".choice").forEach(x=>{if(x.dataset.o===it.a)x.classList.add("ok")});
    $("#gfb").innerHTML=`<div class="explain oops">الإجابة الصحيحة: <b class="en">${it.a}</b></div>`;
    if(hearts<=0){setTimeout(()=>{$(".panel").innerHTML=head("😅 انتهت القلوب")+`<div class="result"><div class="big">🐢</div><h2>لا بأس! التعلّم يحتاج محاولات</h2><p>راجع الشرح ثم جرّب مرة ثانية.</p><div class="pfoot" style="justify-content:center"><button class="cta" onclick="openGame('${u.id}',${gi})">حاول مرة ثانية<span class="ic">🔁</span></button></div></div>`},1300)}
    else{k++;setTimeout(draw,1500)}}})}
 draw()}

/* ---- memory match ---- */
function gMatch(u,g,gi){const cards=shuffle(g.pairs.flatMap((p,i)=>[{i,t:p[0]},{i,t:p[1]}]));let open=[],got=0,moves=0,lock=false;
 openOv(head(`${g.e} ${g.tar}`,`<span class="pill" id="mv">🔄 0</span>`)+`<p style="margin:0 0 12px;color:var(--ink2)">اقلب بطاقتين. إذا كانتا متطابقتين تبقيان مفتوحتين!</p><div class="mgrid">${cards.map((c,k)=>{const isEmo=/\p{Extended_Pictographic}/u.test(c.t)&&c.t.length<=4;return `<button class="mc" data-k="${k}" aria-label="بطاقة"><div class="in"><div class="fa fr">❔</div><div class="fa bk en">${isEmo?`<span class="emo2">${c.t}</span>`:c.t}</div></div></button>`}).join("")}</div>`,u.color);
 document.querySelectorAll(".mc").forEach(el=>el.onclick=()=>{if(lock||el.classList.contains("open")||el.classList.contains("got"))return;const c=cards[+el.dataset.k];el.classList.add("open");if(!/\p{Extended_Pictographic}/u.test(c.t))say(c.t);open.push(el);
  if(open.length===2){moves++;$("#mv").textContent="🔄 "+moves;const[a,b]=open;const ca=cards[+a.dataset.k],cb=cards[+b.dataset.k];
   if(ca.i===cb.i){a.classList.add("got");b.classList.add("got");open=[];got++;beep(true);if(got===g.pairs.length)setTimeout(()=>winScreen(u,gi,`أنهيت اللعبة في ${moves} محاولة!`),700)}
   else{lock=true;beep(false);setTimeout(()=>{a.classList.remove("open");b.classList.remove("open");open=[];lock=false},900)}}})}

/* ---- sort ---- */
function gSort(u,g,gi){const items=shuffle(g.items);let k=0,mist=0;const placed={};g.buckets.forEach(b=>placed[b[0]]=[]);
 openOv("",u.color);
 function draw(){if(k>=items.length){winScreen(u,gi,mist===0?"تصنيف كامل بدون أخطاء! 🌟":`أنهيت التصنيف مع ${mist} ${mist===1?"خطأ":"أخطاء"}`);return}
  const it=items[k];
  $(".panel").innerHTML=head(`${g.e} ${g.tar}`)+`<div class="gbar"><i style="transform:scaleX(${k/items.length})"></i></div>
  <div class="prompt" style="min-height:110px"><div style="font-size:16px">إلى أين تذهب هذه الكلمة؟</div><div style="display:flex;gap:10px;align-items:center"><span class="sitem en">${it[0]}</span>${sayBtn(it[0])}</div></div>
  <div class="buckets" style="grid-template-columns:repeat(${g.buckets.length},1fr)">${g.buckets.map(b=>`<button class="bucket" data-b="${b[0]}"><span class="be">${b[2]}</span><span class="en">${b[1]}</span><span class="cnt en">${placed[b[0]].map(x=>`<span>${x}</span>`).join("")}</span></button>`).join("")}</div>`;
  say(it[0]);
  document.querySelectorAll(".bucket").forEach(bt=>bt.onclick=()=>{document.querySelectorAll(".bucket").forEach(x=>x.disabled=true);
   const right=document.querySelector(`.bucket[data-b="${it[1]}"]`);
   if(bt.dataset.b===it[1]){bt.classList.add("flash");beep(true)}else{bt.classList.add("wrong");right.classList.add("flash");mist++;beep(false)}
   placed[it[1]].push(it[0]);k++;setTimeout(draw,bt.dataset.b===it[1]?650:1300)})}
 draw()}

/* ---- sentence builder ---- */
function gBuild(u,g,gi){const items=shuffle(g.items);let k=0;
 openOv("",u.color);
 function draw(){if(k>=items.length){winScreen(u,gi,"رتّبت كل الجمل! 🧱");return}
  const [sent,ar]=items[k];const words=sent.split(" ");let order=shuffle(words.map((w,i)=>({w,i})));
  if(order.every((o,i)=>o.i===i)&&words.length>1)order=order.reverse();
  let picked=[];
  $(".panel").innerHTML=head(`${g.e} ${g.tar}`)+`<div class="gbar"><i style="transform:scaleX(${k/items.length})"></i></div>
   <div class="prompt" style="min-height:80px;font-size:20px">🗨️ ${ar}</div>
   <div class="slot" id="slot" aria-label="الجملة"></div><div class="chips" id="chips">${order.map((o,j)=>`<button class="chip en" data-j="${j}">${o.w}</button>`).join("")}</div>
   <div class="pfoot"><button class="cta soft" id="hint">💡 مساعدة</button><button class="cta" id="chk">تحقّق<span class="ic">✔</span></button></div>`;
  const slot=$("#slot");
  function refresh(){slot.innerHTML=picked.map((j,p)=>`<button class="chip en" data-p="${p}">${order[j].w}</button>`).join("");document.querySelectorAll("#chips .chip").forEach(c=>c.classList.toggle("used",picked.includes(+c.dataset.j)));
   slot.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{picked.splice(+c.dataset.p,1);slot.classList.remove("no");refresh()})}
  document.querySelectorAll("#chips .chip").forEach(c=>c.onclick=()=>{const j=+c.dataset.j;if(picked.includes(j))return;picked.push(j);refresh()});
  $("#hint").onclick=()=>{picked=[];const first=order.findIndex(o=>o.i===0);picked.push(first);refresh();say(sent)};
  $("#chk").onclick=()=>{const built=picked.map(j=>order[j].w).join(" ");
   if(built===sent){slot.classList.add("ok");beep(true);say(sent);k++;setTimeout(draw,1300)}
   else{slot.classList.remove("no");void slot.offsetWidth;slot.classList.add("no");beep(false)}};
  refresh()}
 draw()}

/* ============ QUIZ ENGINE ============ */
function quizIntroHTML(u){const best=S.quiz[u.id]||0;
 return `<section class="block reveal" style="text-align:center"><div style="font-size:64px">📝</div><h3 style="justify-content:center">اختبار <span class="en">${u.title}</span></h3>
 <p style="color:var(--ink2)">${u.quiz.length} سؤالاً. بعد كل سؤال سترى الشرح. أفضل نتيجة لك: <b>${best}%</b> ${starsHTML(starsFor(best))}</p>
 <p style="color:var(--ink2);font-size:15px">📗 الأسئلة التي عليها هذه العلامة مأخوذة من تمارين الكتاب.</p>
 <button class="cta" onclick="startQuiz('${u.id}')">ابدأ الاختبار<span class="ic">🚀</span></button></section>`}
function startQuiz(uid){const u=UNITS.find(x=>x.id===uid);runQuiz(shuffle(u.quiz),u.color,`📝 ${u.ar}`,p=>{if(p>(S.quiz[uid]||0)){S.quiz[uid]=p;save()}},()=>renderUnit(u,"quiz"))}
function runQuiz(qs,color,title,onDone,onClose,isFinal){let k=0,score=0;const wrong=[];
 openOv("",color);
 function draw(){if(k>=qs.length){finish();return}const q=qs[k];
  let extra="";
  if(q.clock) extra=clockSVG(q.clock[0],q.clock[1]);
  if(q.read) extra=`<div style="text-align:left;font-weight:500;font-size:17px;background:var(--card);border-radius:16px;padding:12px 14px;line-height:1.7" class="en">📖 ${READING}</div>`;
  $(".panel").innerHTML=head(title,`<span class="pill">${k+1} / ${qs.length}</span>`)+`<div class="gbar"><i style="transform:scaleX(${k/qs.length})"></i></div>
   ${q.s?`<div class="tag" style="display:inline-block;margin-bottom:8px">${q.s}</div>`:""}
   <div class="prompt" style="font-size:21px">${extra}<div class="en" style="display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap">${q.q} ${sayBtn(q.q)}</div></div>
   <div class="choices">${shuffle(q.o).map(o=>`<button class="choice en" data-o="${esc(o)}">${o}</button>`).join("")}</div><div id="qfb"></div>`;
  document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{const ok=b.dataset.o===q.a;document.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.dataset.o===q.a)x.classList.add("ok")});
   if(ok){score++;beep(true)}else{b.classList.add("no");beep(false);wrong.push(q)}
   $("#qfb").innerHTML=`<div class="explain ${ok?"good":"oops"}">${ok?"✅ صح! ":"❌ الإجابة الصحيحة: <b class='en'>"+q.a+"</b><br>"}💡 ${q.ex}</div><div class="pfoot" style="justify-content:flex-end"><button class="cta" id="nx">${k+1<qs.length?"السؤال التالي":"النتيجة"}<span class="ic">←</span></button></div>`;
   $("#nx").onclick=()=>{k++;draw()};$("#nx").focus()})}
 function finish(){const p=Math.round(score/qs.length*100),st=starsFor(p);onDone(p);if(st>=2)confetti();
  const msg=p>=90?"ممتاز! أنت بطل 🏆":p>=70?"جيد جداً! 👏":p>=50?"جيد، راجع الأخطاء 💪":"لا بأس، راجع الشرح وجرّب مرة ثانية 🐢";
  const cert=(isFinal&&p>=70)?`<div class="cert"><div class="core"><div style="font-size:40px">🎓</div><h3>شهادة إتمام – Certificate</h3><p>تشهد مغامرة الإنجليزي أن</p><div class="nm">${esc(S.name||"البطل / البطلة")}</div><p>أنهى/أنهت اختبار الصف الرابع بنتيجة <b>${p}%</b></p>${starsHTML(st)}</div></div>`:"";
  $(".panel").innerHTML=head("النتيجة")+`<div class="result"><div class="big">${st===3?"🏆":st===2?"🥈":st===1?"🌱":"🐢"}</div><h2>${score} / ${qs.length} (${p}%)</h2>${starsHTML(st)}<p style="font-weight:700">${msg}</p>${cert}
   ${wrong.length?`<div class="review"><b>راجع هذه الأسئلة:</b>${wrong.map(q=>`<div><span class="en">${stripTags(q.q)}</span><br>✅ <b class="en">${q.a}</b> — ${q.ex}</div>`).join("")}</div>`:""}
   <div class="pfoot" style="justify-content:center"><button class="cta soft" id="again">أعد الاختبار<span class="ic">🔁</span></button><button class="cta" id="cl">تم<span class="ic">✔</span></button></div></div>`;
  $("#again").onclick=()=>runQuiz(shuffle(qs),color,title,onDone,onClose,isFinal);$("#cl").onclick=()=>{closeOv();onClose()}}
 draw()}

/* ============ FINAL ============ */
function renderFinal(){const best=S.final||0;
 $("#app").innerHTML=`<button class="back" onclick="location.hash='#/'">→ الرئيسية</button>
 <header class="uhead" style="--u:#FFE08A"><div class="core"><div class="emo">🏆</div><div><div class="tag">Final Test • Units W–4 + Learning Clubs</div><h1>الاختبار النهائي — <span class="en">Final Test</span></h1><p>اختبار شامل يشبه أسئلة اختبار <span class="en">A1 Movers</span> في الكتاب: مفردات، قواعد، قراءة، أصوات، ومحادثة.</p></div></div></header>
 <section class="block reveal"><h3>📋 قبل أن تبدأ</h3>
  <div class="bi"><div class="arx"><h4>نصائح الاختبار من الكتاب</h4>• اقرأ كل خيار بتمعّن وقُله في رأسك لترى أيّها يبدو صحيحاً.<br>• في القراءة: اقرأ النص كاملاً قبل أن تجيب، لأن الجمل أحياناً متشابهة جداً!<br>• انظر إلى الصورة جيداً وفكّر في الكلمات التي قد تسمعها.</div>
  <div class="enx en"><h4>Checklist</h4>✔ Countries & nationalities<br>✔ Time + present simple + how often<br>✔ There is / are, some / any, a few / a little<br>✔ Comparatives & superlatives<br>✔ Present continuous, must / mustn't, should</div></div>
  <div style="text-align:center;margin-top:18px"><p style="color:var(--ink2)">${FINAL.length} سؤالاً • أفضل نتيجة: <b>${best}%</b> ${starsHTML(starsFor(best))}</p><button class="cta sun" onclick="startFinal()">ابدأ الاختبار النهائي<span class="ic">🚀</span></button><p style="font-size:14px;color:var(--ink2);margin-top:10px">إذا حصلت على 70% أو أكثر ستحصل على شهادة 🎓</p></div>
 </section>
 <section class="block reveal"><h3>🗺️ هل راجعت كل الوحدات؟</h3><div class="ggrid">${UNITS.map(u=>`<button class="gcard" style="--u:${u.color}" onclick="location.hash='#/u/${u.id}'"><div class="core"><div class="e">${u.emoji}</div><b class="en" style="text-align:right">${u.title}</b><small>${u.ar}</small>${starsHTML(starsFor(S.quiz[u.id]||0))}</div></button>`).join("")}</div></section>`;
 observe();window.scrollTo({top:0})}
function startFinal(){const order=["Vocabulary","Grammar","Reading","Phonics","Everyday English"];const qs=[];order.forEach(s=>{const part=FINAL.filter(q=>q.s===s);qs.push(...(s==="Reading"?part:shuffle(part)))});
 runQuiz(qs,"#FFE08A","🏆 الاختبار النهائي",p=>{if(p>(S.final||0)){S.final=p;save()}},renderFinal,true)}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeOv()});
$("#sndBtn").textContent=S.sound?"🔊":"🔈";
if(document.documentElement.getAttribute("data-theme")==="dark")$("#themeBtn").textContent="☀️";
updateStars();route();
</script>
